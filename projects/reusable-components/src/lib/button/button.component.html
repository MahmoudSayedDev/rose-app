<button 
    class="capitalize cursor-pointer transition-all flex justify-center items-center gap-3 disabled:opacity-75 disabled:cursor-not-allowed! hover:opacity-90"
    [ngClass]="[styleClass(), ' test ', isActive()? activeStyle():'']"
    [type]="type()"
    [attr.form]="form() || null"
    [disabled]="disabled()"
    (click)="handleClick()"
>
    @if (text()) {
        <span>{{text()}}</span>
    }

    @if(!loading()) {
        @if (iconLucide()) {
            <lucide-angular 
                [name]="iconLucide()?.name" 
                [class]="iconLucide()?.class" 
                [strokeWidth]="iconLucide()?.strokeWidth"
                [size]="iconLucide()?.size ?? '24px'">
            </lucide-angular>
        }
    
        @if (iconPrimeNg()) {
            <i [class]="'pi ' + iconPrimeNg()"></i>
        }
    }

    @if (loading()) {
        <i class="pi pi-spin pi-spinner" style="font-size: .9rem;"></i>
    }
</button>
