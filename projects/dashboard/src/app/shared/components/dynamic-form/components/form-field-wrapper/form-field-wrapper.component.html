<div class="field-wrapper">
  @if (field().label) {
    <label
      [for]="field().name"
      class="label mb-2 block dark:text-white! capitalize"
    >
      {{ field().label | translate }}

      @if (field().validators?.required) {
        <span class="text-red-600" aria-hidden="true">*</span>
      }
    </label>
  }

  <ng-content />

  <lib-field-error
    [control]="control()"
    [customMessages]="field().errorMessages"
  ></lib-field-error>
</div>
