<app-form-field-wrapper [field]="field()" [control]="control()">
  <!-- <p-select
    [options]="field().options"
    [(ngModel)]="selectedCity"
    optionLabel="name"
    placeholder="Select a City"
    fluid
  /> -->
  <select
    [id]="field().name"
    [formControl]="control()"
    [attr.aria-invalid]="control().invalid && control().touched"
    [attr.aria-describedby]="
      control().invalid && control().touched ? field().name + '-error' : null
    "
  >
    @if (field().placeholder) {
      <option [ngValue]="null" disabled hidden>
        {{ field().placeholder }}
      </option>
    }

    @for (option of field().options ?? []; track option.value) {
      <option [ngValue]="option.value">
        {{ option.label }}
      </option>
    }
  </select>
</app-form-field-wrapper>
