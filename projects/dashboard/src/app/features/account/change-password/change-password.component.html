<p-toast></p-toast>

<div class="change-password-page">
  <h1 class="page-title">{{ 'account.changePasswordPage.title' | translate }}</h1>

  <div class="account-card">

    <div class="form-fields">

      <div class="form-field">
        <label class="field-label">{{ 'account.changePasswordPage.oldPassword' | translate }}</label>
        <input
          class="field-input"
          type="password"
          [value]="currentPassword()"
          (input)="currentPassword.set($any($event.target).value)"
          [placeholder]="'account.changePasswordPage.oldPasswordPlaceholder' | translate"
        />
      </div>

      <div class="form-field">
        <label class="field-label">{{ 'account.changePasswordPage.newPassword' | translate }}</label>
        <input
          class="field-input"
          type="password"
          [value]="newPassword()"
          (input)="newPassword.set($any($event.target).value)"
          [placeholder]="'account.changePasswordPage.newPasswordPlaceholder' | translate"
        />
      </div>

      <div class="form-field">
        <label class="field-label">{{ 'account.changePasswordPage.confirmPassword' | translate }}</label>
        <input
          class="field-input"
          type="password"
          [value]="confirmPassword()"
          (input)="confirmPassword.set($any($event.target).value)"
          [placeholder]="'account.changePasswordPage.confirmPasswordPlaceholder' | translate"
        />
      </div>

      @if (errorMessage()) {
        <p class="error-message">{{ errorMessage() }}</p>
      }

    </div>

    <div class="actions-row">
      <button class="btn-back" (click)="goBack()">
        ← {{ 'account.changePasswordPage.back' | translate }}
      </button>
      <button
        class="btn-save"
        (click)="changePassword()"
        [disabled]="isLoading()">
        {{
          (isLoading()
            ? 'account.changePasswordPage.submitting'
            : 'account.changePasswordPage.submit') | translate
        }}
      </button>
    </div>

  </div>
</div>
